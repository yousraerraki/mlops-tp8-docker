apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraude-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraude-api
  template:
    metadata:
      labels:
        app: fraude-api
    spec:
      containers:
        - name: api
          image: fraude-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
